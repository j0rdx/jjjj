<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Estudio MJ</title>
  
  <!-- Configuración PWA -->
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-512.png">
  <meta name="theme-color" content="#e8f5e9">
  
  <!-- Tipografía limpia y minimalista (Quicksand) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600&display=swap" rel="stylesheet">

  <style>
    /* 1. FONDO CON DEGRADADO ANIMADO SUTIL */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Quicksand', sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      /* Tonos pastel: verde menta suave y amarillo sutil */
      background: linear-gradient(135deg, #e8f5e9, #fbe9e7, #fff9c4, #e8f5e9);
      background-size: 400% 400%;
      animation: gradienteCalmo 16s ease infinite;
      overflow: hidden;
    }

    @keyframes gradienteCalmo {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* 3. PANTALLA DE CARGA (SPLASH SCREEN) */
    #splash-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #e8f5e9; /* Color de fondo relajante inicial */
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      transition: opacity 0.8s cubic-bezier(0.4, 0, 0.2, 1), transform 0.8s ease;
    }

    #splash-logo {
      width: 120px;
      height: 120px;
      opacity: 0;
      transform: scale(0.8);
      animation: entradaLogo 1.2s forwards ease-out;
    }

    @keyframes entradaLogo {
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    /* Clase para desaparecer la Splash Screen */
    .fade-out {
      opacity: 0;
      transform: translateY(-100vh); /* Se desliza hacia arriba elegantemente */
      pointer-events: none;
    }

    /* 2. EFECTO GLASSMORPHISM (TARJETA DE VIDRIO FLOTANTE) */
    .app-container {
      width: 90%;
      max-width: 400px;
      padding: 40px 30px;
      background: rgba(255, 255, 255, 0.35); /* Transparencia base */
      backdrop-filter: blur(16px); /* Difumina el fondo (Efecto esmerilado) */
      -webkit-backdrop-filter: blur(16px);
      border-radius: 24px;
      border: 1px solid rgba(255, 255, 255, 0.5); /* Borde brillante sutil */
      box-shadow: 0 16px 32px rgba(0, 0, 0, 0.05); /* Sombra muy suave */
      text-align: center;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      opacity: 0;
      transform: translateY(20px);
      animation: aparecerContenido 0.6s 1.6s forwards ease-out; /* Aparece después de la Splash */
    }

    @keyframes aparecerContenido {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Microinteracción: inclinación suave al presionar en celular */
    .app-container:active {
      transform: scale(0.98);
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.03);
    }

    .main-logo {
      width: 160px;
      height: 160px;
      object-fit: contain;
      margin-bottom: 24px;
      /* Animación sutil de respiración para el mándala */
      animation: pulsoMandala 6s ease-in-out infinite;
    }

    @keyframes pulsoMandala {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 4px 6px rgba(0,0,0,0.02)); }
      50% { transform: scale(1.03); filter: drop-shadow(0 12px 20px rgba(0,0,0,0.06)); }
    }

    h1 {
      font-size: 24px;
      color: #2e7d32; /* Verde bosque elegante */
      font-weight: 600;
      letter-spacing: 1px;
      margin-bottom: 10px;
    }

    p {
      font-size: 15px;
      color: #558b2f;
      line-height: 1.5;
    }
  </style>
</head>
<body>

  <!-- Elemento 3: Pantalla de Bienvenida Inicial -->
  <div id="splash-screen">
    <img id="splash-logo" src="icon-512.png" alt="Cargando Estudio MJ">
  </div>

  <!-- Elemento 2: Contenedor Principal (Vidrio Esmerilado) -->
  <div class="app-container">
    <img class="main-logo" src="icon-512.png" alt="Mándala Estudio MJ">
    <h1>Estudio MJ</h1>
    <p>Espacio de armonía, diseño creativo y equilibrio visual.</p>
  </div>

  <script>
    // CONTROL DE LA PANTALLA DE CARGA (SPLASH SCREEN)
    window.addEventListener('DOMContentLoaded', () => {
      // Espera 1.5 segundos para que se aprecie el logo y luego retira la pantalla
      setTimeout(() => {
        const splash = document.getElementById('splash-screen');
        splash.classList.add('fade-out');
      }, 1500);
    });

    // REGISTRO DEL SERVICE WORKER (Para asegurar que funcione Offline)
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then(reg => console.log('Service Worker activo'))
          .catch(err => console.error('Error al registrar SW', err));
      });
    }
  </script>
</body>
</html>
